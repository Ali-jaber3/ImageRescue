name: Build Windows installer and portable ZIP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS compiler if absent
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -notin @(0, 3010)) { throw 'NSIS installation failed.' }
          }
      - name: Verify and package release
        shell: pwsh
        run: .\Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ImageRescue-v0.4.0-Windows
          path: |
            artifacts/ImageRescue-v0.4.0-Setup.exe
            artifacts/ImageRescue-v0.4.0-win-x64.zip
            artifacts/SHA256SUMS.txt
